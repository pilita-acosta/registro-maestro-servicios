services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicios_municipales
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d servicios_municipales"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app:app_dev_password@db:5432/servicios_municipales
    ports:
      - "8000:8000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  api-tests:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    profiles: ["test"]
    environment:
      DATABASE_URL: sqlite:////tmp/registro_maestro_test.db
    command: pytest -q

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  web-e2e:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
    profiles: ["test"]
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  ux-tests:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.e2e
    profiles: ["test"]
    environment:
      PLAYWRIGHT_BASE_URL: http://web-e2e:3000
    depends_on:
      web-e2e:
        condition: service_healthy

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  api_uploads:
